name: Backend CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet restore Worktandem.slnx --locked-mode
      - run: dotnet build Worktandem.slnx --configuration Release --no-restore
      - run: dotnet test Worktandem.slnx --configuration Release --no-build --logger trx
